<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekaterina Korenkova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat+Alternates:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow bordered column on a pale page, tiny uppercase section labels, black pill actions (portfolio template style). */
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --ink: #0a0a0a;
  --muted: #737373;
  --line: #e8e8e8;
  --accent: #5e3b84;
  --mark: #e6d8f5;
  --chip: #f4f4f5;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --surface: #111113; --ink: #f5f5f5; --muted: #a1a1aa;
    --line: #26262a; --accent: #c4a5ee; --mark: #4a3566; --chip: #1c1c1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0c; --surface: #111113; --ink: #f5f5f5; --muted: #a1a1aa;
  --line: #26262a; --accent: #c4a5ee; --mark: #4a3566; --chip: #1c1c1f;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.page { max-width: 880px; margin: 0 auto; background: var(--surface); border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-height: 100vh; }
.section { padding: 40px 48px; border-top: 1px solid var(--line); }
.label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin-bottom: 20px; }

/* banner */
.banner { margin: 20px 20px 0; border-radius: 10px; overflow: hidden; background: #f6f1ec; aspect-ratio: 4 / 1; }
.banner img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* profile */
.profile { padding: 0 48px 32px; position: relative; }
.avatar { width: 136px; height: 136px; border-radius: 50%; margin-top: -68px; border: 4px solid var(--surface); background: var(--chip); overflow: hidden; position: relative; }
.avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
.profile-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.name { font-size: 16px; font-weight: 600; }
.role { font-size: 12px; color: var(--accent); }
.loc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.actions { display: flex; align-items: center; gap: 8px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.lang button { font: inherit; font-size: 11px; font-weight: 500; border: 0; background: transparent; color: var(--muted); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.theme { position: relative; width: 56px; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); cursor: pointer; padding: 0; flex: none; transition: background .25s, border-color .25s; }
.theme .thumb { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform .3s cubic-bezier(.4, 0, .2, 1), background .25s; }
.theme svg { position: absolute; top: 7px; width: 14px; height: 14px; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .25s; }
.theme .sun { left: 7px; stroke: var(--bg); }
.theme .moon { right: 7px; stroke: var(--muted); }
.theme[aria-checked="true"] .thumb { transform: translateX(26px); }
.theme[aria-checked="true"] .sun { stroke: var(--muted); }
.theme[aria-checked="true"] .moon { stroke: var(--bg); }
.theme:hover { border-color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .theme .thumb, .theme svg { transition: none; } }
.pill { font: inherit; font-size: 12px; font-weight: 500; text-decoration: none; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; display: inline-block; }
.pill:hover { opacity: .85; }

/* about */
.lead { font-size: 26px; line-height: 1.4; font-weight: 500; letter-spacing: -.01em; text-wrap: balance; }
.lead mark { background: linear-gradient(transparent 55%, var(--mark) 55%); color: inherit; padding: 0 2px; }
.sub { color: var(--muted); font-size: 14px; margin-top: 16px; max-width: 62ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; }
.chip { font-size: 11px; border: 1px solid var(--line); background: var(--chip); border-radius: 6px; padding: 3px 9px; }

/* linkedin highlight */
.li-card { display: flex; align-items: center; gap: 20px; padding: 22px 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--chip); text-decoration: none; color: inherit; transition: border-color .2s, transform .2s; }
.li-card:hover { border-color: #0a66c2; transform: translateY(-2px); }
.li-ico { flex: none; width: 52px; height: 52px; border-radius: 12px; background: #0a66c2; color: #fff; display: grid; place-items: center; }
.li-ico svg { width: 26px; height: 26px; }
.li-main { display: grid; gap: 4px; flex: 1; min-width: 0; }
.li-num { font-size: 34px; line-height: 1; font-weight: 700; letter-spacing: -.03em; color: #0a66c2; }
.li-t { font-size: 15px; font-weight: 600; }
.li-d { font-size: 13px; color: var(--muted); line-height: 1.5; }
.li-btn { flex: none; font-size: 12px; font-weight: 600; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; white-space: nowrap; }
.li-card:hover .li-btn { background: #0a66c2; border-color: #0a66c2; color: #fff; }
@media (max-width: 640px) { .li-card { flex-wrap: wrap; } .li-btn { width: 100%; text-align: center; } }
:root[data-theme="dark"] .li-num { color: #6cb4ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .li-num { color: #6cb4ff; } }
/* audience cards */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.card.wide { grid-column: 1 / -1; }
.art { height: 120px; }
.card.wide .art { height: 96px; }
.art.a1 { background: radial-gradient(80% 120% at 20% 100%, #ffb88a, transparent 60%), radial-gradient(70% 100% at 90% 0%, #b8a9ff, transparent 60%), #f3effa; }
.art.a2 { background: radial-gradient(90% 120% at 80% 100%, #8fd3c4, transparent 60%), radial-gradient(70% 100% at 10% 0%, #ffe29a, transparent 60%), #eef7f4; }
.art.a4 { background: radial-gradient(90% 120% at 30% 110%, #7ed957, transparent 60%), radial-gradient(70% 100% at 100% 0%, #ffd84d, transparent 60%), #f1f9ec; }
.art.a3 { background: radial-gradient(90% 120% at 50% 120%, #ff8f7a, transparent 55%), radial-gradient(70% 100% at 100% 0%, #9ec5ff, transparent 60%), #eef3fb; }
.card-body { padding: 14px 16px 16px; }
.card h3 { font-size: 13px; font-weight: 600; }
.card p { font-size: 12px; color: var(--muted); margin-top: 2px; }

@media (min-width: 760px) {
  .cards { grid-template-columns: repeat(3, 1fr); }
  .card.wide { grid-column: auto; }
  .card.wide .art { height: 120px; }
}

/* portfolio showcase */
.work-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.work-title { font-size: 26px; line-height: 1.25; font-weight: 500; letter-spacing: -.01em; max-width: 22ch; text-wrap: balance; }
.arrows { display: flex; gap: 8px; flex: none; }
.arrow { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; transition: border-color .2s, opacity .2s; }
.arrow svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.arrow:hover:not(:disabled) { border-color: var(--ink); }
.arrow:disabled { opacity: .35; cursor: default; }
.track { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-left: 0; padding-bottom: 4px; scrollbar-width: none; }
.track::-webkit-scrollbar { display: none; }
.work { flex: 0 0 86%; min-width: 0; scroll-snap-align: start; display: grid; gap: 16px; align-content: start; }
.work-art { aspect-ratio: 16 / 10; border-radius: 12px; border: 1px solid var(--line); position: relative; overflow: hidden; }
.work-art::after { content: attr(data-ph); position: absolute; left: 14px; bottom: 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgba(0,0,0,.45); }
.work-meta { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.work-meta h3 { font-size: 15px; font-weight: 600; }
.work-meta p { font-size: 13px; color: var(--muted); margin-top: 4px; max-width: 52ch; }
.work-link { font-size: 12px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border-bottom: 1px solid transparent; }
.work-link:hover { border-bottom-color: currentColor; }
.work-link svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 520px) {
  .work { flex-basis: 88%; }
  .work-meta { flex-direction: column; align-items: flex-start; gap: 10px; }
  .work-title { font-size: 21px; }
}

/* case page overlay */
.work-art { background-size: cover; background-position: center; }
.work-art.has-img::after, .shot.has-img::after { display: none; }
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; justify-content: center; }
.overlay[hidden] { display: none; }
.sheet { position: relative; width: min(960px, 100%); height: 100%; overflow-y: auto; background: var(--surface); color: var(--ink); padding: 0 48px 48px; overscroll-behavior: contain; }
.sheet-bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 16px 0; background: var(--surface); border-bottom: 1px solid var(--line); margin-bottom: 36px; }
.sheet-bar .label { margin: 0; }
.close { font: inherit; font-size: 12px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.close:hover { border-color: var(--ink); }
.case-title { font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em; max-width: 20ch; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 12px 40px; margin: 24px 0 32px; }
.meta div { display: grid; gap: 2px; }
.meta dt { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.meta dd { margin: 0; font-size: 13px; }
.shot { position: relative; margin: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(135deg, var(--chip), var(--surface)); }
.shot::after { content: attr(data-ph); position: absolute; left: 14px; bottom: 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.shot img { display: block; width: 100%; height: auto; }
.shot:not(.has-img) { min-height: 240px; }
.poster-wrap .shot:not(.has-img) { aspect-ratio: 997 / 1425; }
.c-block { display: grid; grid-template-columns: 200px 1fr; gap: 24px; padding: 40px 0; border-top: 1px solid var(--line); }
.c-block > .label { margin: 0; padding-top: 4px; }
.c-text { display: grid; gap: 14px; font-size: 15px; line-height: 1.65; max-width: 62ch; }
.goals { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.goal { font-size: 12px; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 5px 12px; }
.specimens { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.spec { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 4px; }
.spec b { font-size: 12px; font-weight: 600; }
.spec .aa { font-size: 76px; line-height: 1; letter-spacing: -.02em; }
.spec .abc { font-size: 12px; color: var(--muted); }
.serif { font-family: Excelsior, "Excelsior LT", Georgia, "Times New Roman", serif; font-weight: 700; }
.sans { font-family: Verdana, Geneva, sans-serif; font-weight: 700; }
.mont { font-family: "Montserrat Alternates", "Montserrat", system-ui, sans-serif; font-weight: 700; }
.swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; margin-top: 16px; }
.swatch { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.swatch i { display: block; height: 72px; }
.swatch div { padding: 10px 12px; font-size: 11px; color: var(--muted); display: grid; gap: 1px; font-variant-numeric: tabular-nums; }
.swatch div b { color: var(--ink); font-size: 12px; font-weight: 600; }
.poster-wrap { max-width: 460px; }
.mocks { display: grid; gap: 16px; }
.credit { padding-top: 32px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
@media (max-width: 640px) {
  .sheet { padding: 0 20px 32px; }
  .case-title { font-size: 26px; }
  .c-block { grid-template-columns: 1fr; gap: 14px; padding: 28px 0; }
  .specimens { grid-template-columns: 1fr; }
  .swatches { grid-template-columns: 1fr 1fr; }
}

/* services list */
.item { display: grid; grid-template-columns: 1fr; gap: 6px; padding-bottom: 28px; }
.item + .item { padding-top: 28px; border-top: 1px dashed var(--line); }
.item:last-child { padding-bottom: 0; }
.item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.item-title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
.ico { width: 28px; height: 28px; border-radius: 8px; background: var(--chip); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.ico svg { width: 15px; height: 15px; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.price { font-size: 11px; color: var(--muted); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item ul { margin: 6px 0 0 38px; padding: 0; color: var(--muted); font-size: 13px; display: grid; gap: 4px; }
.note { margin-top: 24px; font-size: 12px; color: var(--muted); }

/* timeline */
.tl { display: grid; gap: 18px; }
.tl-row { display: grid; grid-template-columns: 120px 14px 1fr; gap: 12px; align-items: start; }
.tl-date { font-size: 11px; color: var(--muted); padding-top: 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); margin: 7px auto 0; }
.tl-title { font-weight: 600; font-size: 13px; }
.tl-sub { font-size: 12px; color: var(--muted); }

/* side stuff */
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 14px 0; border-top: 1px dashed var(--line); }
.kv:first-of-type { border-top: 0; padding-top: 0; }
.kv-k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.kv-v { display: grid; gap: 4px; font-size: 13px; }
.kv-v span small { color: var(--muted); font-size: 12px; margin-left: 6px; }

/* contact form */
.form { margin-top: 24px; display: grid; gap: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 12px; font-weight: 500; }
.field input, .field select, .field textarea { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; width: 100%; transition: border-color .2s, box-shadow .2s; }
.field textarea { min-height: 120px; resize: vertical; }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: .7; }
.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--muted); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.form-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.form-foot .pill:disabled { opacity: .5; cursor: default; }
.status { font-size: 12px; color: var(--muted); }
.status.ok { color: #15803d; }
.status.err { color: #b91c1c; }
:root[data-theme="dark"] .status.ok { color: #4ade80; }
:root[data-theme="dark"] .status.err { color: #f87171; }
.privacy { font-size: 11px; color: var(--muted); }
@media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }

footer { padding: 20px 48px 32px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

@media (max-width: 520px) {
  .section, footer { padding-left: 20px; padding-right: 20px; }
  .profile { padding-left: 20px; padding-right: 20px; }
  .banner { margin: 12px 12px 0; }
  .avatar { width: 104px; height: 104px; margin-top: -52px; }
  .cards { grid-template-columns: 1fr; }
  .lead { font-size: 19px; }
  .tl-row, .kv { grid-template-columns: 1fr; gap: 2px; }
  .tl-row { grid-template-columns: 14px 1fr; }
  .tl-date { grid-column: 2; order: 2; }
  .dot { grid-row: 1; grid-column: 1; }
  .tl-row > div:last-child { grid-column: 2; }
  .item ul { margin-left: 20px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<main class="page">
  <div class="banner">
    <img src="banner.jpg" width="1080" height="270" alt="Marketing &amp; Communications Specialist: brand communication, campaigns, events, digital marketing">
  </div>

  <header class="profile">
    <div class="avatar"><img src="photo.png" width="200" height="200" alt="Ekaterina Korenkova"></div>
    <div class="profile-row">
      <div>
        <div class="name">Ekaterina Korenkova</div>
        <div class="role" id="role"></div>
        <div class="loc" id="loc"></div>
      </div>
      <div class="actions">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        </div>
        <button type="button" class="theme" id="theme" role="switch" aria-checked="false" aria-label="Tema oscuro">
          <span class="thumb"></span>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <a class="pill" id="cta" href="#contacto"></a>
      </div>
    </div>
  </header>

  <section class="section" id="sobre-mi">
    <div class="label" id="l-about"></div>
    <p class="lead" id="lead"></p>
    <p class="sub" id="sub"></p>
    <div class="chips" id="chips"></div>
  </section>

  <section class="section" id="linkedin">
    <div class="label" id="l-li"></div>
    <a class="li-card" id="li-card" target="_blank" rel="noopener">
      <span class="li-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg></span>
      <span class="li-main"><span class="li-num" id="li-num"></span><span class="li-t" id="li-t"></span><span class="li-d" id="li-d"></span></span>
      <span class="li-btn" id="li-btn"></span>
    </a>
  </section>

  <section class="section" id="proyectos" aria-labelledby="work-title">
    <div class="label" id="l-work"></div>
    <div class="work-head">
      <h2 class="work-title" id="work-title"></h2>
      <div class="arrows">
        <button type="button" class="arrow" id="work-prev" aria-label="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" class="arrow" id="work-next" aria-label="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>

function setStatus(text, kind) { var s = $("f-status"); s.textContent = text; s.className = "status" + (kind ? " " + kind : ""); }

$("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var f = T[currentLang].form;
  var name = $("f-name"), email = $("f-email"), msg = $("f-message");
  if ($("f-web").value) return; // honeypot: bots fill this hidden field
  var bad = [name, email, msg].filter(function (el) { return !el.value.trim() || (el.type === "email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(el.value.trim())); });
  [name, email, msg].forEach(function (el) { el.setAttribute("aria-invalid", String(bad.indexOf(el) > -1)); });
  if (bad.length) { setStatus(f.invalid, "err"); bad[0].focus(); return; }

  var data = { name: name.value.trim(), email: email.value.trim(), service: $("f-service").value, message: msg.value.trim() };

  if (CONFIG.formEndpoint) {
    var btn = $("f-send");
    btn.disabled = true; setStatus(f.sending);
    fetch(CONFIG.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(data) })
      .then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        setStatus(f.ok, "ok"); $("form").reset();
      })
      .catch(function () { setStatus(f.fail, "err"); })
      .then(function () { btn.disabled = false; });
  } else if (CONFIG.email) {
    var body = f.fName + ": " + data.name + "\n" + f.fEmail + ": " + data.email + "\n" + f.fService + ": " + data.service + "\n\n" + data.message;
    setStatus(f.mailOpen);
    window.location.href = "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent(f.subject) + "&body=" + encodeURIComponent(body);
  } else if (CONFIG.demoMode) {
    // Placeholder only: nothing is sent anywhere. Set demoMode to false or add formEndpoint/email before launch.
    var b2 = $("f-send");
    b2.disabled = true; setStatus(f.sending);
    setTimeout(function () { setStatus(f.ok, "ok"); $("form").reset(); b2.disabled = false; }, 700);
  } else {
    setStatus(f.notReady, "err");
  }
});

function loadInto(el) {
  var src = el.getAttribute("data-src");
  if (!src) return;
  var im = new Image();
  im.onload = function () {
    if (el.tagName === "FIGURE") { im.alt = el.getAttribute("data-alt") || ""; im.loading = "lazy"; el.innerHTML = ""; el.appendChild(im); }
    else { el.style.backgroundImage = 'url("' + src + '")'; }
    el.classList.add("has-img");
  };
  im.src = src;
}

    colors: [["#8DC63F", "R141 G198 B63", "C29 M0 Y68 K22"], ["#009444", "R0 G148 B68", "C100 M0 Y54 K42"], ["#245960", "R36 G89 B96", "C63 M7 Y0 K62"], ["#FB0A28", "R251 G10 B40", "C0 M96 Y84 K2"]],
    sections: [{ key: "formats", imgs: ["formats.jpg"] }, { key: "outdoor", imgs: ["outdoor.jpg"] }] },
  { key: "hm", dir: "case-hm", hero: "hero.jpg",
    sections: [{ key: "context", imgs: ["context.jpg"] }, { key: "survey", imgs: ["survey.jpg", "survey2.jpg"] }, { key: "decision", imgs: ["decision.jpg"] }, { key: "framework", imgs: ["framework.jpg"] }, { key: "ecosystem", imgs: ["ecosystem.jpg"] }, { key: "platforms", imgs: ["platforms.jpg"] }, { key: "roadmap", imgs: ["roadmap.jpg"] }, { key: "kpi", imgs: ["kpi.jpg"] }] },
  { key: "duo", dir: "case-duo", hero: "hero.jpg",
    sections: [{ key: "audit", imgs: ["ig.jpg", "tiktok.jpg", "linkedin.jpg"] }, { key: "brand", imgs: ["brand.jpg"] }, { key: "bench", imgs: ["babbel.jpg", "mondly.jpg"] }, { key: "swot", imgs: ["swot.jpg"] }, { key: "strategy", imgs: ["objectives.jpg", "audience.jpg", "content.jpg", "engagement.jpg"] }, { key: "kpi", imgs: ["kpi.jpg", "measure.jpg"] }] }
];
function caseBy(key) { for (var i = 0; i < CASES.length; i++) if (CASES[i].key === key) return CASES[i]; return null; }
function buildCase(t, cfg) {
  var u = t[cfg.key];
  $("case-kicker").textContent = u.kicker;
  $("case-close").textContent = u.close;
  var paras = u.paras || [u.obj, u.brand];
  $("case-body").innerHTML =
    '<h2 class="case-title" id="case-title">' + esc(u.title) + "</h2>" +
    '<dl class="meta">' + u.meta.map(function (m) { return "<div><dt>" + esc(m[0]) + "</dt><dd>" + esc(m[1]) + "</dd></div>"; }).join("") + "</dl>" +
    shot(cfg.dir + "/" + cfg.hero, "hero-shot", u.title, u.ph) +
    '<div class="c-block"><div class="label">' + esc(u.about) + '</div><div class="c-text">' + paras.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + '<div class="goals">' + u.goals.map(function (g) { return '<span class="goal">' + esc(g) + "</span>"; }).join("") + "</div></div></div>" +
    (cfg.fonts ?     '<div class="c-block"><div class="label">' + esc(u.type) + '</div><div><div class="specimens">' + cfg.fonts.map(function (f) { return '<div class="spec"><b>' + f[0] + '</b><span class="aa ' + f[1] + '">Aa</span><span class="abc ' + f[1] + '">Aa Bb Cc Dd Ee Ff Gg Hh Ii Jj Kk Ll Mm Nn Oo Pp Qq Rr Ss Tt Uu Vv Ww Xx Yy Zz</span></div>'; }).join("") + "</div>" +
      '<div class="label" style="margin:28px 0 0">' + esc(u.colorLabel) + '</div><div class="swatches">' + cfg.colors.map(function (c) { return '<div class="swatch"><i style="background:' + c[0] + '"></i><div><b>' + c[0] + "</b><span>" + c[1] + "</span><span>" + c[2] + "</span></div></div>"; }).join("") + "</div></div></div>" : "") +
    cfg.sections.map(function (sec) {
      return '<div class="c-block"><div class="label">' + esc(u[sec.key]) + '</div><div class="' + (sec.cls || "") + '">' + sec.imgs.map(function (f, i) { return shot(cfg.dir + "/" + f, "", u[sec.key] + (sec.imgs.length > 1 ? " " + (i + 1) : ""), u.ph); }).join("") + "</div></div>";
    }).join("") +
    '<div class="credit"><span>' + esc(u.credit) + '</span><button type="button" class="close" id="case-close-2">' + esc(u.close) + "</button></div>";
  $("case-close-2").addEventListener("click", closeCase);
  document.querySelectorAll("#case-body [data-src]").forEach(loadInto);
}
var overlay = $("case-overlay"), lastFocus = null, openKey = null;
function openCase(key) {
  var cfg = caseBy(key);
  if (!cfg) return;
  buildCase(T[currentLang], cfg);
  openKey = key;
  if (overlay.hidden) {
    lastFocus = document.activeElement;
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
  }
  $("case-sheet").scrollTop = 0;
  $("case-close").focus();
}
function hideCase() { overlay.hidden = true; openKey = null; document.body.style.overflow = ""; }
function closeCase() {
  hideCase();
  if (/^#caso-/.test(location.hash)) location.hash = "proyectos";
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function route() {
  var m = /^#caso-([a-z]+)$/.exec(location.hash);
  if (m && caseBy(m[1])) openCase(m[1]); else if (!overlay.hidden) hideCase();
}
$("case-close").addEventListener("click", closeCase);
overlay.addEventListener("click", function (e) { if (e.target === overlay) closeCase(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !overlay.hidden) closeCase(); });
window.addEventListener("hashchange", route);

var track = $("work-track");
function step() { var c = track.querySelector(".work"); return c ? c.getBoundingClientRect().width + 20 : 300; }
function updateArrows() {
  $("work-prev").disabled = track.scrollLeft <= 4;
  $("work-next").disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
}
function slide(dir) { track.scrollBy({ left: dir * step(), behavior: "smooth" }); }
$("work-prev").addEventListener("click", function () { slide(-1); });
$("work-next").addEventListener("click", function () { slide(1); });
track.addEventListener("scroll", updateArrows, { passive: true });
window.addEventListener("resize", updateArrows);
track.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight") { e.preventDefault(); slide(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); slide(-1); }
});

var THEME_LABEL = { es: "Tema oscuro", en: "Dark theme", ru: "Тёмная тема" };
function applyTheme(mode) {
  document.documentElement.setAttribute("data-theme", mode);
  $("theme").setAttribute("aria-checked", String(mode === "dark"));
}
function currentTheme() {
  var a = document.documentElement.getAttribute("data-theme");
  if (a === "dark" || a === "light") return a;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
var savedTheme = null;
try { savedTheme = localStorage.getItem("ek-theme"); } catch (e) {}
applyTheme(savedTheme === "dark" || savedTheme === "light" ? savedTheme : currentTheme());
$("theme").addEventListener("click", function () {
  var next = currentTheme() === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("ek-theme", next); } catch (e) {}
});

var start = "es";
try { start = localStorage.getItem("ek-lang") || "es"; } catch (e) {}
currentLang = T[start] ? start : "es";
render(currentLang);
route();
</script>
</body>
